name: Update academic data

on:
  schedule:
    # Wednesday 06:17 in Sao Paulo (UTC-3).
    - cron: "17 9 * * 3"
  workflow_dispatch:

permissions:
  contents: read
  checks: read

concurrency:
  group: update-academic-data-main
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TZ: America/Sao_Paulo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify required secrets
        shell: bash
        env:
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          SCOPUS_API_KEY: ${{ secrets.SCOPUS_API_KEY }}
          SCOPUS_INSTTOKEN: ${{ secrets.SCOPUS_INSTTOKEN }}
          ACADEMIC_UPDATE_PUSH_TOKEN: ${{ secrets.ACADEMIC_UPDATE_PUSH_TOKEN }}
        run: |
          set -euo pipefail
          for name in SERPAPI_API_KEY SCOPUS_API_KEY SCOPUS_INSTTOKEN ACADEMIC_UPDATE_PUSH_TOKEN; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing GitHub Actions secret: ${name}"
              exit 1
            fi
          done

      - name: Collect and reconcile source data
        shell: bash
        env:
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          SERPAPI_API_KEY2: ${{ secrets.SERPAPI_API_KEY2 }}
          SCOPUS_API_KEY: ${{ secrets.SCOPUS_API_KEY }}
          SCOPUS_INSTTOKEN: ${{ secrets.SCOPUS_INSTTOKEN }}
          GH_API_TOKEN: ${{ github.token }}
          ACADEMIC_SCHEDULED_REFRESH: ${{ github.event_name == 'schedule' && 'true' || 'false' }}
        run: |
          set -euo pipefail
          trap 'rm -f keys.json' EXIT
          umask 077
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          profile = json.loads(Path("profile.json").read_text(encoding="utf-8"))
          sources = profile["profiles"]
          keys = {
              "github_username": sources["github"]["username"],
              "github_token": os.environ["GH_API_TOKEN"],
              "scholar_author_id": sources["google_scholar"]["author_id"],
              "serpapi_api_key": os.environ["SERPAPI_API_KEY"],
              "serpapi_api_key2": os.environ.get("SERPAPI_API_KEY2", ""),
              "orcid_id": sources["orcid"]["id"],
              "scopus_api_key": os.environ["SCOPUS_API_KEY"],
              "scopus_insttoken": os.environ["SCOPUS_INSTTOKEN"],
              "scopus_author_id": sources["scopus"]["author_id"],
              "wos_researcher_id": sources["web_of_science"]["researcher_id"],
          }
          Path("keys.json").write_text(
              json.dumps(keys, ensure_ascii=False) + "\n", encoding="utf-8"
          )
          PY
          python update_fallback.py

      - name: Validate generated data and repository
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_bibliometric_metrics.py --check
          python -m unittest discover -s tests -p "test_*.py"
          python -B scripts/render_shared_site.py --check
          python scripts/audit_repository.py
          git diff --check

      - name: Stage candidate on temporary audit branch
        id: candidate
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.ACADEMIC_UPDATE_PUSH_TOKEN }}
        run: |
          set -euo pipefail
          git add -- \
            fallback-data.json \
            bibliometric-metrics.json \
            academic-registry.json \
            bibliographic-source-links.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No academic data changes to publish."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(data): refresh academic metrics"

          candidate_branch="automation/academic-refresh/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "branch=$candidate_branch" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

          # PAT-authenticated branch pushes trigger Repository audit.
          gh auth setup-git
          git push origin HEAD:"refs/heads/$candidate_branch"

      - name: Wait for required repository audit
        if: steps.candidate.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          set -euo pipefail
          # Rule set 'main' requires the 'audit' check from GitHub Actions (app 15368).
          # The check is attached to the exact candidate commit SHA, not the branch.
          # Transient GitHub API errors (including truncated JSON) must not
          # prevent a previously validated dataset from being published.
          # The audit check must still succeed on this exact candidate SHA.
          for attempt in $(seq 1 36); do
            if audit_result="$(gh api \
              "repos/$GITHUB_REPOSITORY/commits/$CANDIDATE_SHA/check-runs?check_name=audit" \
              --jq '[.check_runs[] | select(.name == "audit" and .app.id == 15368) | if .status == "completed" then .conclusion else "pending" end][0] // "pending"')"; then
              case "$audit_result" in
                success)
                  echo "Required audit passed on commit $CANDIDATE_SHA."
                  exit 0
                  ;;
                pending)
                  echo "Awaiting repository audit (attempt $attempt/36)."
                  ;;
                *)
                  # Explicit failure/cancellation or unexpected results
                  # never authorize a push to the protected main branch.
                  echo "::error::Required repository audit finished with $audit_result."
                  exit 1
                  ;;
              esac
            else
              echo "::warning::GitHub check API temporarily unavailable (attempt $attempt/36); retrying."
            fi
            if [[ "$attempt" -lt 36 ]]; then sleep 10; fi
          done
          echo "::error::Timed out waiting for a successful required repository audit."
          exit 1

      - name: Publish audited commit to main
        id: publish
        if: steps.candidate.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.ACADEMIC_UPDATE_PUSH_TOKEN }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          gh auth setup-git
          # No force push: fail if main has changed since checkout.
          # Required audit already succeeded on this exact commit SHA.
          git push origin HEAD:refs/heads/main

      - name: Remove temporary audit branch
        # Keep the candidate branch for recovery whenever validation/push fails.
        if: always() && steps.candidate.outputs.changed == 'true' && steps.publish.outcome == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.ACADEMIC_UPDATE_PUSH_TOKEN }}
          CANDIDATE_BRANCH: ${{ steps.candidate.outputs.branch }}
        run: |
          set -euo pipefail
          gh auth setup-git
          git push origin ":refs/heads/$CANDIDATE_BRANCH" || \
            echo "::warning::Could not remove the temporary audit branch."
